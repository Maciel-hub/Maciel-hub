<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">MACIEL-HUB — Cyberpunk developer portfolio</title>
  <desc id="desc">Dark futuristic banner with violet and magenta neon lines, a digital grid, and developer-themed typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08070d"/>
      <stop offset="55%" stop-color="#171025"/>
      <stop offset="100%" stop-color="#090810"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3cac"/>
      <stop offset="50%" stop-color="#bd5cff"/>
      <stop offset="100%" stop-color="#6ee7ff"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#bd5cff" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <path d="M0 250 L250 250 L300 200 L490 200 L530 160 L750 160 L790 120 L1200 120" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".7"/>
  <path d="M0 270 L210 270 L260 220 L450 220" fill="none" stroke="#ff3cac" stroke-width="1.5" opacity=".5"/>
  <path d="M880 0 L880 58 L930 108 L930 200 L1000 270 L1200 270" fill="none" stroke="#bd5cff" stroke-width="2" opacity=".6"/>
  <path d="M1040 0 L1040 42 L1080 82 L1080 160" fill="none" stroke="#6ee7ff" stroke-width="1.5" opacity=".45"/>
  <g fill="#bd5cff" opacity=".85">
    <circle cx="300" cy="200" r="3" filter="url(#glow)"/>
    <circle cx="530" cy="160" r="3" filter="url(#glow)"/>
    <circle cx="930" cy="200" r="3" filter="url(#glow)"/>
  </g>
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="74" y="83" font-size="15" letter-spacing="5" fill="#ff3cac">SYSTEM ONLINE // PORTFOLIO</text>
    <text x="70" y="151" font-size="61" font-weight="700" letter-spacing="2" fill="#f5efff">GUILHERME</text>
    <text x="74" y="198" font-size="29" font-weight="700" letter-spacing="8" fill="url(#neon)">MACIEL-HUB</text>
    <text x="75" y="238" font-size="15" letter-spacing="2" fill="#b9b0cb">TECHNOLOGY · DATA · DIGITAL PRODUCTS</text>
    <text x="1000" y="303" font-size="11" letter-spacing="2" fill="#8d829f">v.01 / 2026</text>
  </g>
  <g transform="translate(1000 62)" fill="none" stroke="url(#neon)" stroke-width="2" filter="url(#glow)">
    <path d="M0 0h82l25 25v82H25L0 82z" opacity=".85"/>
    <path d="M20 26l20 18-20 18M52 62h23" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>